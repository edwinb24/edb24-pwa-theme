name: Deploy theme to production

# The built CSS and JS are committed (gulp's sass task is not repeatable),
# so this workflow ships the repo as it is. It never runs gulp.

on:
    push:
        branches: [main]
        paths-ignore:
            - 'README.md'
            - 'LICENSE.md'
            - '.gitignore'
            - 'deploy/**'
    workflow_dispatch:

concurrency:
    group: deploy-theme
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@v4

            - name: Check the theme files
              run: |
                  set -euo pipefail
                  for f in style.css functions.php header.php front-page.php \
                    assets/preprocess/scripts/custom_corner.js; do
                    test -f "$f" || { echo "Missing $f"; exit 1; }
                  done
                  ls assets/css/*.css assets/js/*.js > /dev/null
                  find . -name '*.php' -not -path './node_modules/*' -print0 \
                    | xargs -0 -n1 php -l

            - name: Set up SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh
                  # Strip Windows line endings, which OpenSSH rejects.
                  printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
                  chmod 644 ~/.ssh/known_hosts
                  # Fail early with a clear message if the key can't be read.
                  # The fingerprint is safe to print; compare it with
                  # `ssh-keygen -lf <key>.pub` on the machine that made the key.
                  if ! ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy_key.pub 2>/dev/null; then
                    echo "::error::SSH_PRIVATE_KEY is not a valid private key. Paste the whole private key file (BEGIN/END lines included), not the .pub file."
                    exit 1
                  fi
                  echo "Deploy key fingerprint: $(ssh-keygen -lf /tmp/deploy_key.pub)"

            - name: Upload the theme
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
              run: |
                  # Build files and Sass sources stay out of the public theme folder.
                  # --delete-excluded also removes them from earlier uploads, so the
                  # install step drops them from the live theme too.
                  rsync -az --delete --delete-excluded \
                    --exclude '.git/' --exclude '.github/' \
                    --exclude 'deploy/' --exclude 'node_modules/' \
                    --exclude '/package.json' --exclude '/package-lock.json' \
                    --exclude '/gulpfile.js' --exclude '/.gitignore' --exclude '/.gitattributes' \
                    --exclude '/assets/preprocess/sass/' \
                    -e "ssh -i $HOME/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
                    ./ "$SSH_USER@$SSH_HOST:releases/edb24-pwa-theme/"

            - name: Install the theme on the server
              env:
                  SSH_HOST: ${{ secrets.SSH_HOST }}
                  SSH_USER: ${{ secrets.SSH_USER }}
                  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
              run: |
                  ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
                    "$SSH_USER@$SSH_HOST" "sudo -n /usr/local/sbin/deploy-edb24-theme"

            - name: Check the site responds
              run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://edwinbroce.com/ > /dev/null

            - name: Remove the SSH key
              if: always()
              run: rm -f ~/.ssh/deploy_key
